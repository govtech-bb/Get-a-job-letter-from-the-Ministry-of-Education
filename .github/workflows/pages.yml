name: Mirror staging branch into /staging/ on main

# Pages is configured to "Deploy from a branch: main / root", so /staging/
# isn't a separate deploy target — it's a folder inside main. This workflow
# syncs the staging branch's files into main:/staging/ whenever staging is
# updated, so https://.../staging/ shows the staging build.
#
# Pushes from GITHUB_TOKEN don't trigger workflows again, so there's no loop.

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-staging
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main (with full history so we can commit back)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check out staging branch into a sibling directory
        uses: actions/checkout@v4
        with:
          ref: staging
          path: _staging_source

      - name: Replace main's /staging/ folder with the staging branch's content
        run: |
          rm -rf staging
          mkdir staging

          # Copy everything from the staging checkout except .git and the
          # server-only files. Use a positive include list so only the static
          # demo lives at /staging/.
          for entry in *.html *.css *.js employees.json assets; do
            if [ -e "_staging_source/$entry" ]; then
              cp -r "_staging_source/$entry" "staging/"
            fi
          done

          # The /staging/ root needs its own index.html as the demo entry.
          # Everything in there links relatively, so nothing else has to change.

          rm -rf _staging_source

          ls -la staging/

      - name: Commit and push if there are changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add staging
          if git diff --staged --quiet; then
            echo "No changes to /staging/."
          else
            git commit -m "Sync staging branch into /staging/ ($(date -u +%FT%TZ))"
            git push origin main
          fi
