<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Letter — Job letters admin</title>
  <link rel="icon" href="/assets/images/favicon.ico" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/page.css" />
  <style>
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 3px;
      font-size: 0.78rem; font-weight: var(--font-weight-bold);
    }
    .badge--sent   { background: var(--color-green-10); color: var(--color-green-00); }
    .badge--failed { background: var(--color-red-10);   color: var(--color-red-00); }
    .badge--other  { background: #eef0f3;                color: var(--color-text-muted); }
    .card {
      background: #fff; border: 1px solid var(--color-grey-00);
      border-radius: 4px; padding: var(--spacing-m);
      margin-bottom: var(--spacing-m);
    }
    .card h2 { margin-top: 0; }
    .kv { display: grid; grid-template-columns: 14rem minmax(0, 1fr); gap: var(--spacing-xs); }
    @media (max-width: 600px) {
      .kv { grid-template-columns: 1fr; gap: 4px; }
      .kv dt { margin-top: var(--spacing-xs); }
    }
    .kv dt { color: var(--color-text-muted); }
    .kv dd { margin: 0; font-weight: var(--font-weight-bold); word-break: break-word; }
    .ref { font-family: ui-monospace, Consolas, monospace; }
    .failure-detail {
      background: var(--color-red-10);
      border-left: 4px solid var(--color-red-00);
      padding: var(--spacing-s);
      margin-top: var(--spacing-s);
      font-size: 0.9rem;
    }
  </style>
</head>
<body class="govbb-page">

  <main id="main-content" class="page-main">
    <p style="margin-bottom: var(--spacing-s);">
      <a class="govbb-link" href="/admin/letters.html">← All letters</a>
    </p>

    <div id="content">
      <p class="govbb-text-body">Loading…</p>
    </div>
  </main>

  <script src="/admin/admin-chrome.js"></script>
  <script>
    const LETTER_TYPE_LABELS = {
      teacher_appointed: "Teacher (permanent)",
      teacher_special:   "Teacher with special responsibility",
      ministry_permanent:"Ministry staff — permanent",
      ministry_temporary:"Ministry staff — temporary",
    };

    function escapeHtml(s) {
      if (s == null) return "";
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
    }
    function fmtAbsolute(iso) {
      if (!iso) return "—";
      return new Date(iso).toLocaleString("en-GB", {
        day: "numeric", month: "long", year: "numeric",
        hour: "2-digit", minute: "2-digit",
      });
    }
    function moneyFmt(v) {
      if (v == null || v === "") return "—";
      return "$" + Number(v).toLocaleString("en-US", {
        minimumFractionDigits: 2, maximumFractionDigits: 2,
      });
    }
    function emailBadge(status) {
      if (status === "sent")
        return `<span class="badge badge--sent">Delivered</span>`;
      if (status && status.startsWith("failed"))
        return `<span class="badge badge--failed">Failed</span>`;
      return `<span class="badge badge--other">${escapeHtml(status || "pending")}</span>`;
    }

    (async () => {
      const root = document.getElementById("content");
      const id = new URLSearchParams(location.search).get("id");
      if (!id) {
        root.innerHTML = `
          <div class="panel-warning">
            <h1 class="govbb-text-h2">No letter reference</h1>
            <p>Open a row from the <a class="govbb-link" href="/admin/letters.html">letters list</a>.</p>
          </div>`;
        return;
      }

      const r = await fetch("/api/admin/letter?id=" + encodeURIComponent(id), { credentials: "same-origin" });
      if (r.status === 401) { location.href = "/admin/login.html"; return; }
      if (r.status === 404) {
        root.innerHTML = `
          <div class="panel-warning">
            <h1 class="govbb-text-h2">Letter not found</h1>
            <p>We have no record of a letter with reference <span class="ref">${escapeHtml(id)}</span>.</p>
          </div>`;
        return;
      }
      if (!r.ok) {
        root.innerHTML = `<p>Could not load this letter. Please try again.</p>`;
        return;
      }

      const { letter } = await r.json();
      const e = letter.employee;
      const failureDetail = (letter.emailStatus || "").startsWith("failed")
        ? `<div class="failure-detail"><strong>Why it failed:</strong> ${escapeHtml(letter.emailStatus.replace(/^failed:\s*/, ""))}</div>`
        : "";

      document.title = `Letter ${letter.id} — Job letters admin`;

      root.innerHTML = `
        <h1 class="govbb-text-h1" style="margin-bottom: var(--spacing-xs);">Letter</h1>
        <p class="govbb-text-body" style="color: var(--color-text-muted); margin-bottom: var(--spacing-m);">
          <span class="ref">${escapeHtml(letter.id)}</span>
        </p>

        <section class="card">
          <h2 class="govbb-text-h3">Delivery</h2>
          <dl class="kv">
            <dt>Status</dt>            <dd>${emailBadge(letter.emailStatus)}</dd>
            <dt>Issued</dt>            <dd><time datetime="${escapeHtml(letter.issuedAt)}">${escapeHtml(fmtAbsolute(letter.issuedAt))}</time></dd>
            <dt>Valid until</dt>       <dd><time datetime="${escapeHtml(letter.validUntil)}">${escapeHtml(fmtAbsolute(letter.validUntil))}</time></dd>
            <dt>Sent to</dt>           <dd>${escapeHtml(letter.recipientEmail)}</dd>
            <dt>Email message ID</dt>  <dd>${letter.emailMessageId ? `<span class="ref">${escapeHtml(letter.emailMessageId)}</span>` : "—"}</dd>
          </dl>
          ${failureDetail}
        </section>

        <section class="card">
          <h2 class="govbb-text-h3">Employee record at issue</h2>
          <p class="govbb-text-caption" style="color: var(--color-text-muted); margin-bottom: var(--spacing-s);">
            A snapshot of the employee's record at the moment the letter was generated.
            Current values may now differ.
          </p>
          <dl class="kv">
            <dt>Name</dt>              <dd>${escapeHtml(e.title || "")} ${escapeHtml(e.firstName || "")} ${escapeHtml(e.lastName || "")}</dd>
            <dt>Pronoun</dt>           <dd>${escapeHtml(e.pronoun || "—")}</dd>
            <dt>Letter type</dt>       <dd>${escapeHtml(LETTER_TYPE_LABELS[e.letterType] || e.letterType || "")}</dd>
            <dt>Post</dt>              <dd>${escapeHtml(e.post || "")}</dd>
            <dt>School / employer</dt> <dd>${escapeHtml(e.school || e.employer || "")}</dd>
            <dt>Address</dt>           <dd>${escapeHtml(e.address || "—")}</dd>
            <dt>Appointment date</dt>  <dd>${escapeHtml(e.appointmentDate || "")}</dd>
            <dt>Monthly salary</dt>    <dd>${escapeHtml(moneyFmt(e.monthlySalary))}</dd>
            <dt>Monthly allowance</dt> <dd>${escapeHtml(moneyFmt(e.monthlyAllowance))}</dd>
            <dt>Pay frequency</dt>     <dd>${escapeHtml(e.payFrequency || "monthly")}</dd>
            <dt>Acting at issue</dt>   <dd>${e.isActing ? "Yes" : "No"}</dd>
            <dt>Active at issue</dt>   <dd>${e.isActive ? "Yes" : "No"}</dd>
          </dl>
          <p style="margin-top: var(--spacing-s);">
            <a class="govbb-link" href="/admin/employee-edit.html?email=${encodeURIComponent(e.email)}">
              Open this employee's current record →
            </a>
          </p>
        </section>
      `;
    })();
  </script>
</body>
</html>
