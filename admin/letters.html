<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Letters — Job letters admin</title>
  <link rel="icon" href="/assets/images/favicon.ico" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/page.css" />
  <style>
    .toolbar {
      display: flex; gap: var(--govbb-space-s);
      align-items: end; flex-wrap: wrap;
      margin-bottom: var(--govbb-space-s);
    }
    .toolbar .field { flex: 1; min-width: 200px; }
    .toolbar input, .toolbar select {
      width: 100%; padding: var(--govbb-space-xs) var(--govbb-space-s);
      border: 2px solid var(--govbb-color-ink);
      border-radius: var(--govbb-radius);
      font: inherit; background: #fff;
    }
    table.records {
      width: 100%; border-collapse: collapse;
      background: #fff; border: 1px solid var(--govbb-grey-20);
      border-radius: 4px; overflow: hidden;
    }
    table.records th, table.records td {
      padding: var(--govbb-space-xs) var(--govbb-space-s);
      text-align: left;
      border-bottom: 1px solid var(--govbb-grey-20);
      font-size: 0.9rem; vertical-align: top;
    }
    table.records th {
      background: #f6f7f9; color: var(--govbb-color-muted);
      text-transform: uppercase; font-size: 0.75rem;
      letter-spacing: 0.04em; font-weight: 700;
    }
    table.records tr:last-child td { border-bottom: 0; }
    table.records tbody tr:hover td { background: #fafbfc; }
    .badge {
      display: inline-block; padding: 2px 8px;
      border-radius: 3px; font-size: 0.75rem; font-weight: 700;
    }
    .badge--sent   { background: var(--govbb-green-10); color: var(--govbb-green-80); }
    .badge--failed { background: var(--govbb-red-10);   color: var(--govbb-red-80); }
    .badge--other  { background: #eef0f3;                color: var(--govbb-color-muted); }
    .pager {
      display: flex; gap: var(--govbb-space-s);
      justify-content: space-between; align-items: center;
      margin-top: var(--govbb-space-s); font-size: 0.9rem;
      color: var(--govbb-color-muted);
    }
  </style>
</head>
<body class="govbb-page">

  <main id="main-content" class="page-main">
    <div class="stack">
      <h1 class="govbb-text-h1">Letters</h1>
      <p class="govbb-text-body">
        A record of every job letter the service has issued. This list is read-only —
        there is nothing to approve. Select <strong>View</strong> on a row to see the
        snapshotted record and email delivery status.
      </p>
    </div>

    <div class="toolbar">
      <div class="field">
        <label class="govbb-label" for="q" style="font-size:0.85rem;">Search</label>
        <input id="q" type="search" placeholder="Name, email, or reference…" />
      </div>
      <div class="field" style="max-width:200px;">
        <label class="govbb-label" for="status" style="font-size:0.85rem;">Email status</label>
        <select id="status">
          <option value="">All</option>
          <option value="sent">Delivered</option>
          <option value="failed">Failed</option>
          <option value="pending">Pending</option>
        </select>
      </div>
    </div>

    <table class="records" id="rows-table">
      <thead>
        <tr>
          <th style="width:12rem;">Issued</th>
          <th>Employee</th>
          <th>Type</th>
          <th>Sent to</th>
          <th style="width:6rem;">Email</th>
          <th>Reference</th>
          <th style="text-align:right;">Action</th>
        </tr>
      </thead>
      <tbody id="rows-body">
        <tr><td colspan="7" style="color:var(--govbb-color-muted);padding:var(--govbb-space-m);text-align:center;">Loading…</td></tr>
      </tbody>
    </table>

    <div class="pager">
      <div id="pager-info">—</div>
      <div>
        <button class="govbb-button govbb-button--text" type="button" id="prev-page" disabled>← Previous</button>
        <button class="govbb-button govbb-button--text" type="button" id="next-page" disabled>Next →</button>
      </div>
    </div>

  </main>

  <script src="/admin/admin-chrome.js"></script>
  <script>
    const LETTER_TYPE_LABELS = {
      teacher_appointed: "Teacher (permanent)",
      teacher_special:   "Teacher + allowance",
      ministry_permanent:"Ministry — permanent",
      ministry_temporary:"Ministry — temporary",
    };

    function fmtAbsolute(iso) {
      return new Date(iso).toLocaleString("en-GB", {
        day: "numeric", month: "long", year: "numeric",
        hour: "2-digit", minute: "2-digit",
      });
    }
    function fmtRelative(iso) {
      const mins = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
      if (mins < 1)  return "just now";
      if (mins < 60) return `${mins} min ago`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24)  return `${hrs}h ago`;
      const days = Math.floor(hrs / 24);
      if (days < 30) return `${days}d ago`;
      return new Date(iso).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
    }
    function escapeHtml(s) {
      if (s == null) return "";
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
    }
    function emailBadge(status) {
      if (status === "sent") return `<span class="badge badge--sent">Delivered</span>`;
      if (status && status.startsWith("failed")) return `<span class="badge badge--failed">Failed</span>`;
      return `<span class="badge badge--other">${escapeHtml(status || "pending")}</span>`;
    }

    // Pick up ?q= from the URL so the dashboard's search bar can deep-link here.
    const _initialQ = new URLSearchParams(location.search).get("q") || "";
    const state = { page: 1, q: _initialQ, status: "", total: 0, pageSize: 50 };
    if (_initialQ) document.getElementById("q").value = _initialQ;

    async function load() {
      const params = new URLSearchParams({ page: state.page });
      if (state.q) params.set("q", state.q);
      if (state.status) params.set("status", state.status);
      const r = await fetch("/api/admin/letters?" + params, { credentials: "same-origin" });
      if (r.status === 401) { location.href = "/admin/login.html"; return; }
      if (!r.ok) {
        document.getElementById("rows-body").innerHTML =
          `<tr><td colspan="7" style="padding:var(--govbb-space-m);">Failed to load letters.</td></tr>`;
        return;
      }
      const data = await r.json();
      state.total = data.total; state.pageSize = data.pageSize;

      const tbody = document.getElementById("rows-body");
      if (!data.rows.length) {
        const isEmptyService = state.total === 0 && !state.q && !state.status;
        tbody.innerHTML = isEmptyService
          ? `<tr><td colspan="7" style="padding:var(--govbb-space-l);text-align:center;color:var(--govbb-color-muted);">
               <strong style="color: var(--govbb-color-ink); display:block; margin-bottom: var(--govbb-space-xs);">No letters issued yet.</strong>
               Letters issued by the service will appear here, with full delivery status.
             </td></tr>`
          : `<tr><td colspan="7" style="padding:var(--govbb-space-m);text-align:center;color:var(--govbb-color-muted);">No letters match those filters.</td></tr>`;
      } else {
        tbody.innerHTML = data.rows.map(row => `
          <tr>
            <td><time datetime="${escapeHtml(row.issuedAt)}" title="${escapeHtml(fmtRelative(row.issuedAt))}">${escapeHtml(fmtAbsolute(row.issuedAt))}</time></td>
            <td>${escapeHtml(row.firstName || "")} ${escapeHtml(row.lastName || "")}<br /><span style="font-size:0.8rem;color:var(--govbb-color-muted);">${escapeHtml(row.post || "")}</span></td>
            <td>${escapeHtml(LETTER_TYPE_LABELS[row.letterType] || row.letterType || "")}</td>
            <td>${escapeHtml(row.recipientEmail)}</td>
            <td>${emailBadge(row.emailStatus)}</td>
            <td><span class="ref" style="font-family:ui-monospace,Consolas,monospace;font-size:0.8rem;">${escapeHtml(row.id)}</span></td>
            <td style="text-align:right;"><a class="govbb-link" href="/admin/letter.html?id=${encodeURIComponent(row.id)}">View</a></td>
          </tr>`).join("");
      }

      const from = (state.page - 1) * state.pageSize + 1;
      const to = Math.min(state.page * state.pageSize, state.total);
      document.getElementById("pager-info").textContent =
        state.total === 0 ? "No results" : `Showing ${from}–${to} of ${state.total}`;
      document.getElementById("prev-page").disabled = state.page <= 1;
      document.getElementById("next-page").disabled = to >= state.total;
    }

    let timer;
    document.getElementById("q").addEventListener("input", (e) => {
      clearTimeout(timer);
      timer = setTimeout(() => { state.q = e.target.value.trim(); state.page = 1; load(); }, 200);
    });
    document.getElementById("status").addEventListener("change", (e) => {
      state.status = e.target.value; state.page = 1; load();
    });
    document.getElementById("prev-page").addEventListener("click", () => { if (state.page > 1) { state.page--; load(); }});
    document.getElementById("next-page").addEventListener("click", () => { state.page++; load(); });

    load();
  </script>
</body>
</html>
