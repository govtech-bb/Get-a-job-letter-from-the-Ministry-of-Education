# Netlify deploy config — mirrors what vercel.json does today.
#
# The service is a set of static HTML pages at the repo root plus a JSON API.
# Both must be served from ONE origin: the admin pages call relative /api/*
# URLs with credentials:"same-origin" and the session cookie is SameSite=Lax,
# so a split frontend/API deploy would break admin sign-in entirely.

[build]
  publish = "."
  command = ""
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  # "nft" copies the module tree instead of inlining it, which keeps
  # import.meta.url meaningful — server/pdf.js resolves its letterhead images
  # relative to its own location.
  node_bundler = "nft"
  included_files = ["assets/images/**"]

# vercel.json rewrites /v -> /verify.html (the short URL printed on letters).
[[redirects]]
  from = "/v"
  to = "/verify.html"
  status = 200

# publish = "." serves the whole repo, so keep server-side sources out of the
# public tree. Nothing here is secret (no filled-in .env is committed) but
# there is no reason to hand them out either.
[[redirects]]
  from = "/server/*"
  to = "/not-found.html"
  status = 404

[[redirects]]
  from = "/netlify/*"
  to = "/not-found.html"
  status = 404
