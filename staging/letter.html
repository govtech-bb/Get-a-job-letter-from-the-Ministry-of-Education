<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your letter — Job letters</title>
  <link rel="icon" href="assets/images/favicon.ico" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="page.css" />
</head>
<body class="govbb-page">

  <main id="main-content" class="page-main" data-breadcrumbs='[{"label":"Job letters","href":"index.html"},{"label":"Your letter"}]'>
    <div id="letter-root">
      <p class="govbb-text-body">Loading your letter…</p>
    </div>
  </main>

  <script src="https://unpkg.com/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="app.js"></script>
  <script src="chrome.js"></script>
  <script>
    (async () => {
      const root = document.getElementById("letter-root");
      const token = location.hash.replace(/^#/, "");
      if (!token) {
        root.innerHTML = `
          <div class="panel-warning">
            <h1 class="govbb-text-h2">No letter to show</h1>
            <p>This link does not include a letter reference. <a class="govbb-link" href="index.html">Start again</a>.</p>
          </div>`;
        return;
      }

      const result = await JobLetters.decodeAndVerify(token);
      if (!result.valid) {
        root.innerHTML = `
          <div class="panel-error">
            <h1 class="govbb-text-h2">This letter could not be read</h1>
            <p>${JobLetters.escapeHtml(result.reason)}</p>
            <p><a class="govbb-link" href="index.html">Start again</a></p>
          </div>`;
        return;
      }

      const letter = result.letter;
      const verifyUrl = location.origin + location.pathname.replace(/[^/]*$/, "verify.html") + "#" + token;

      root.innerHTML = `
        <div class="panel-success stack">
          <h1 class="govbb-text-h2">Your job letter</h1>
          <p class="govbb-text-body">
            Issued ${JobLetters.escapeHtml(JobLetters.formatLongDate(letter.issuedAt))} for
            <strong>${JobLetters.escapeHtml(letter.employee.firstName)} ${JobLetters.escapeHtml(letter.employee.lastName)}</strong>.
          </p>
        </div>

        <div class="govbb-btn-group">
          <button class="govbb-btn" id="btn-download">Download PDF letter</button>
          <a class="govbb-btn--tertiary" href="${JobLetters.escapeHtml(verifyUrl)}" target="_blank" rel="noopener">View verification page</a>
        </div>

        <div class="stack">
          <h2 class="govbb-text-h3">Letter reference</h2>
          <dl class="key-value">
            <dt>Reference number</dt>
            <dd><code>${JobLetters.escapeHtml(letter.id)}</code></dd>
            <dt>Issued at</dt>
            <dd>${JobLetters.escapeHtml(JobLetters.formatDateTime(letter.issuedAt))}</dd>
            <dt>Valid until</dt>
            <dd>${JobLetters.escapeHtml(JobLetters.formatLongDate(letter.validUntil))}</dd>
          </dl>
          <p class="govbb-text-caption">
            Anyone receiving this letter can verify it by scanning the QR code on the letter,
            or by visiting the verification link printed on it.
          </p>
        </div>

        <details class="govbb-show-hide" open>
          <summary class="govbb-show-hide__summary">Preview the letter</summary>
          <div class="govbb-show-hide__content">
            <div id="letter-preview"></div>
          </div>
        </details>
      `;

      const previewWrap = document.getElementById("letter-preview");
      previewWrap.innerHTML = JobLetters.renderLetterHtml(letter, { verifyUrl, token });

      // Render the QR code inside the preview
      const qrTarget = previewWrap.querySelector("#letter-qr");
      if (qrTarget) JobLetters.injectQrInto(qrTarget, verifyUrl);

      document.getElementById("btn-download").addEventListener("click", async (e) => {
        const btn = e.currentTarget;
        btn.disabled = true;
        btn.textContent = "Preparing PDF…";
        try {
          await JobLetters.downloadPdf(letter, verifyUrl);
        } finally {
          btn.disabled = false;
          btn.textContent = "Download PDF letter";
        }
      });
    })();
  </script>
</body>
</html>
