<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Verify a letter — Job letters</title>
  <link rel="icon" href="assets/images/favicon.ico" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="page.css" />
  <style>
    /* Public verification strap — visible to the relying party who scanned
       the QR. Frames the page as a government verification, not a private
       letter view. */
    .verify-strap {
      background: var(--color-blue-100);
      color: #fff;
      padding: var(--spacing-m);
      border-radius: 4px;
      margin-bottom: var(--spacing-m);
    }
    .verify-strap__title {
      font-size: 1.75rem;
      font-weight: var(--font-weight-bold);
      line-height: 1.2;
      margin: 0 0 var(--spacing-xs);
      color: #fff;
    }
    .verify-strap__lede {
      font-size: 1.05rem;
      line-height: 1.5;
      margin: 0;
      opacity: 0.95;
    }
    /* Demote any h1 inside the verify-root since the strap already carries the
       primary heading for the page. */
    #verify-root h1 { font-size: 1.5rem; }
  </style>
</head>
<body class="govbb-page">

  <main id="main-content" class="page-main" data-breadcrumbs='[{"label":"Job letters","href":"index.html"},{"label":"Verify a letter"}]'>
    <!--
      Public verification strap — for relying parties (banks, retailers).
      Always shown, regardless of whether the verification succeeded, so the
      visitor immediately understands what this page is for.
    -->
    <div class="verify-strap">
      <h1 class="verify-strap__title">You scanned a Ministry of Education job letter</h1>
      <p class="verify-strap__lede">
        This page confirms whether the letter you received is genuine and current.
      </p>
    </div>

    <div id="verify-root">
      <p class="govbb-text-body">Checking the letter…</p>
    </div>
  </main>

  <script src="app.js"></script>
  <script src="chrome.js"></script>
  <script>
    (async () => {
      const root = document.getElementById("verify-root");

      // The QR/URL carries the letter id and HMAC signature as query params
      // (id, t). For backwards-compat the page still accepts the older
      // client-side payload-in-hash form and falls back to client decode.
      const qs = new URLSearchParams(location.search);
      const hashToken = location.hash.replace(/^#/, "");
      const id = qs.get("id");
      const signature = qs.get("t");

      if (!id && !hashToken) {
        root.innerHTML = `
          <div class="panel-warning">
            <h2 class="govbb-text-h3">No letter reference provided</h2>
            <p>This page is opened by scanning the QR code on a Ministry of Education job letter, or by following the verification link printed on one.</p>
          </div>`;
        return;
      }

      let result;
      if (id && signature) {
        result = await JobLetters.apiVerifyLetter(id, signature);
      } else {
        // Old self-contained URL format — verify locally.
        result = await JobLetters.decodeAndVerify(hashToken);
      }

      if (!result.valid) {
        root.innerHTML = `
          <div class="panel-error stack">
            <span class="verify-stamp verify-stamp--invalid">✗ Verification failed</span>
            <h2 class="govbb-text-h3">This letter could not be verified</h2>
            <p class="govbb-text-body">${JobLetters.escapeHtml(result.reason)}</p>
          </div>

          <div class="stack">
            <h2 class="govbb-text-h3">What to do</h2>
            <p class="govbb-text-body">
              If you received this letter from someone claiming to be a Ministry of Education employee,
              do not rely on it. Ask them to issue a new letter via this service.
            </p>
            <p class="govbb-text-body">For help, contact the Ministry's Personnel Department.</p>
          </div>`;
        return;
      }

      const letter = result.letter;
      const emp = letter.employee;
      const postLine = JobLetters.escapeHtml(emp.post) + (emp.school ? ", " + JobLetters.escapeHtml(emp.school) : "");

      root.innerHTML = `
        <div class="stack">
          <span class="verify-stamp">✓ Verified — this letter is genuine</span>
          <h2 class="govbb-text-h2">This letter was issued by the Ministry of Education Transformation.</h2>
        </div>

        <div class="stack">
          <h2 class="govbb-text-h3">What this letter confirms</h2>
          <dl class="key-value">
            <dt>Employee</dt>
            <dd>${JobLetters.escapeHtml(emp.title)} ${JobLetters.escapeHtml(emp.firstName)} ${JobLetters.escapeHtml(emp.lastName)}</dd>
            <dt>Post</dt>
            <dd>${postLine}</dd>
            <dt>Employer</dt>
            <dd>${JobLetters.escapeHtml(emp.employer)}</dd>
            <dt>Employment status</dt>
            <dd>${JobLetters.escapeHtml(JobLetters.employmentLabel(emp.letterType))}</dd>
            <dt>Issued on</dt>
            <dd>${JobLetters.escapeHtml(JobLetters.formatLongDate(letter.issuedAt))}</dd>
            <dt>Reference</dt>
            <dd><code>${JobLetters.escapeHtml(letter.id)}</code></dd>
          </dl>
          <p class="govbb-text-caption" style="color: var(--color-text-muted);">
            Salary information is on the letter itself and is not shown on this public page.
          </p>
        </div>

        <details class="govbb-show-hide">
          <summary class="govbb-show-hide__summary">How this verification works</summary>
          <div class="govbb-show-hide__content">
            <p>
              Each letter is signed with a code held by the Ministry of Education's service.
              When you scan the QR code, this page checks that signature against the Ministry's record.
              If the letter has been altered after it was issued, the signature will no longer match
              and verification will fail.
            </p>
            <p>
              Verification reflects the Ministry's record at the time the letter was issued. If the
              employee has since left or changed posts, this page will continue to show what the
              letter said when it was originally signed.
            </p>
          </div>
        </details>`;
    })();
  </script>
</body>
</html>
